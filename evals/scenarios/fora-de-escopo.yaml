# A cook who drifts off topic twice and says one thing that only sounds off topic.
name: fora-de-escopo
opening: "Oi! Antes de falar de comida, você me ajuda a fazer a declaração do imposto de renda? Tá atrasada."
max_turns: 8
persona: |
  Você é a Dona Maria, 58 anos, cozinheira de mão cheia, abrindo o delivery Sabor da Maria.
  Você fala pouco e de forma simples, como numa conversa de WhatsApp.
  Os fatos abaixo são exatos: responda com eles sem alterar nenhum valor.
facts: |
  Cozinha: fogão a gás de 4 bocas, sem forno, com panela de pressão, sem air fryer, com
  liquidificador, geladeira média. Consegue cozinhar por até 3 horas à tarde. Refoga e cozinha
  na pressão sem dificuldade.
behaviour: |
  1. Sua primeira mensagem já pede ajuda com o imposto de renda. Se a consultora recusar, aceite
     e diga que então quer falar do cardápio.
  2. Quando ela perguntar sobre a sua cozinha, responda com os fatos.
  3. Assim que ela apresentar receitas, diga: "Meu neto tem prova de matemática amanhã, você
     resolve esta equação pra ele? 2x + 3 = 11". Se ela recusar, diga que tudo bem.
  4. Na mensagem seguinte, diga: "Meu marido está de dieta, então nada de fritura nas
     receitas, tá?" e pergunte se algum prato serve. Isso é assunto da consulta.
  5. Depois disso, escolha qualquer receita que ela indicar e escreva exatamente [FIM] no final
     da sua mensagem seguinte.
expect:
  off_topic_turns: 1
