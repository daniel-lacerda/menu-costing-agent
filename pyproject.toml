[project]
name = "menu-costing-agent"
version = "0.1.0"
description = "Hermes Agent profile: menu and pricing consultant for a home cook opening a delivery"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "openpyxl>=3.1,<4",
    "pydantic>=2.13,<3",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-openpyxl",
    "types-requests",
]
# The evaluation suite runs inside the Hermes environment (scripts/evaluate.sh); these are the
# same packages it needs there, declared so the suite's own tests and type checks run here.
evals = [
    "anthropic>=1,<2",
    "openai>=2,<3",
    "requests>=2,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The importable code is the Hermes plugin, which lives where Hermes loads it from.
pythonpath = ["profile/plugins", "evals"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
# Any is the honest type at the JSON boundary (tool arguments, results, schemas).
ignore = ["ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "profile/plugins:evals"
files = ["profile/plugins/menu_costing", "evals"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Provided by the Hermes runtime; imported inside the functions that need them.
module = ["hermes_constants", "hermes_cli.*", "hermes_state_registry", "hermes_state_ids", "run_agent"]
ignore_missing_imports = true
