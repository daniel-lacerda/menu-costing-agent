[project]
name = "menu-costing-agent"
version = "0.1.0"
description = "Hermes Agent profile: menu and pricing consultant for a home cook opening a delivery"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1,<4",
    "pydantic>=2.13,<3",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-openpyxl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The importable code is the Hermes plugin, which lives where Hermes loads it from.
pythonpath = ["profile/plugins"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
# Any is the honest type at the JSON boundary (tool arguments, results, schemas).
ignore = ["ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "profile/plugins"
packages = ["menu_costing"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Provided by the Hermes runtime; only imported inside register().
module = ["hermes_constants", "hermes_cli.*"]
ignore_missing_imports = true
