# Hermes Agent profile configuration for the Sabor da Maria consultant.
# Secrets never live here; they come from .env in the same directory.

model:
  provider: openai-api
  default: gpt-6-sol

# Side tasks (context compression, session titles) do not need the main model's reasoning.
auxiliary:
  compression:
    provider: openai-api
    model: gpt-6-luna
  title_generation:
    provider: openai-api
    model: gpt-6-luna
  # The post-turn self-improvement review writes memory and skills unprompted.
  background_review:
    enabled: false

# Native toolsets are an explicit allowlist. The plugin toolset (menu_costing) is not listed:
# an enabled plugin's toolset joins the platform by itself, and the CLI validates this list
# before plugins are discovered.
platform_toolsets:
  cli:
    - web
    - clarify
    - skills
    - memory

# Tool Search defers plugin tools behind discovery tools; it exists for catalogs with hundreds
# of tools. Six tools stay visible in full.
tools:
  tool_search:
    enabled: "off"

web:
  backend: firecrawl

memory:
  memory_enabled: true
  user_profile_enabled: true

# The agent may read skills freely but every skill write waits for human approval.
skills:
  write_approval: true

plugins:
  enabled:
    - menu_costing
    - observability/langfuse
  entries:
    menu_costing:
      allow_tool_override: false
      settings:
        pantry_path: data/despensa_dona_maria.xlsx
        budget_brl: 80.0
        platform_fee: 0.10
        margins: [0.20, 0.35, 0.50]
        # Off-topic turns are triaged and answered by the cheap model, never by the main one.
        scope_guard: true
        scope_model: gpt-6-luna
      # The plugin may pick this one cheaper model for its own calls; nothing else.
      llm:
        allow_model_override: true
        allowed_models: [gpt-6-luna]

display:
  language: pt
  show_reasoning: false

# Config schema version understood by Hermes v0.21.3; pinned so the first run does not migrate
# and rewrite this file.
_config_version: 45
